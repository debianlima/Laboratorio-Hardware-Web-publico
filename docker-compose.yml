version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab_hardware_app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./docs:/var/www/html/docs
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-lab_hardware}
      - DB_USER=${DB_USER:-lab_user}
      - DB_PASS=${DB_PASS:-lab_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab_network

  db:
    image: mysql:8.0
    container_name: lab_hardware_db
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-lab_hardware}
      MYSQL_USER: ${DB_USER:-lab_user}
      MYSQL_PASSWORD: ${DB_PASS:-lab_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lab_network

volumes:
  db_data:
    driver: local

networks:
  lab_network:
    driver: bridge
