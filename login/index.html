<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login - Sistema Laboratório de Hardware 2025">
  <title>Login - Lab Hardware</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-page">
  <main class="login-container">
    <div class="login-card">
      <div class="login-header text-center">
        <h1 class="login-title">Lab Hardware</h1>
        <p class="login-subtitle">Sistema de Controle do Laboratório</p>
      </div>

      <div id="alert-container" class="mb-3" role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required
            minlength="3"
            maxlength="50"
            aria-describedby="username-help"
          >
          <div id="username-help" class="form-text">Informe seu usuário de acesso.</div>
          <div class="invalid-feedback">Usuário é obrigatório (mínimo 3 caracteres).</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Senha</label>
          <div class="input-group">
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
              minlength="4"
              aria-describedby="toggle-password"
            >
            <button
              class="btn btn-outline-secondary"
              type="button"
              id="toggle-password"
              aria-label="Mostrar ou ocultar senha"
            >
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
              </svg>
            </button>
          </div>
          <div class="invalid-feedback">Senha é obrigatória (mínimo 4 caracteres).</div>
        </div>

        <button type="submit" class="btn btn-primary btn-login w-100 py-3 fw-bold" id="login-btn">
          <span id="login-btn-text">Entrar</span>
          <span id="login-btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
      </form>

      <div class="login-footer text-center mt-4">
        <p class="text-muted small mb-0">&copy; <span id="current-year"></span> Lab Hardware 2025</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
